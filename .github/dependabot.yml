version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 8 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - mehrwiedu
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "43 3 15 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - mehrwiedu
